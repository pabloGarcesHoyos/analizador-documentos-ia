[pytest]
testpaths = app/tests
pythonpath = app
markers =
    integracion: pruebas contra un proyecto real de Supabase
    sql_local: pruebas de RLS contra un Postgres local con el esquema de Supabase
    groq: pruebas que llaman al modelo de Groq
    reserva: casos de reserva del agente, escritos antes de ajustar el prompt agente_v2
    reserva2: segunda reserva del agente, escrita antes de la ronda agente_v3
addopts = -m "not integracion and not sql_local and not groq"
asyncio_default_fixture_loop_scope = function
